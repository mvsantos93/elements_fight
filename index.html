<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="styles.css">
        <title>Fight of the Elements - Vinni</title>
    </head>
    
    <body>
        <main class="main-container">
            <header class="header">
                <div class="title-container">
                    <div class="title-top">
                        <span class="title-fight">FIGHT</span>
                        <span class="title-of-the">
                            <span>OF</span>
                            <span>THE</span>
                        </span>
                    </div>
                    <span class="title-elements">ELEMENTS</span>
                </div>
                <section class="logic">
                    <h2>LOGIC</h2>
                    <img src="images/logic_elements.png" alt="Image showing which element wins against another">
                </section>
            </header>
            
            <section class="choices">
                <div class="player-element-container">
                    <h2>CHOOSE YOUR ELEMENT:</h2>
                    <img src="images/fire.png" alt="">
                    <img src="images/water.png" alt="">
                    <img src="images/grass.png" alt="">
                </div>
                <div class="cpu-element-container">
                    <h2>CPU CHOOSES:</h2>
                    <img src="images/grass.png" alt="">
                </div>
            </section>

            <section class="battle">
                <div class="vs-header">
                    <h1>THE FIGHT IS</h1>
                </div>
                <div class="vs-container">
                    <img src="images/fire.png" alt="">
                    <h2>VS</h2>
                    <img src="images/grass.png" alt="">
                </div>
            </section>

            <section class="result">
                <h1>CONGRATULATIONS, YOU WON!</h1>
            </section>
        </main>
    </body>
</html>
